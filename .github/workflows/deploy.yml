name: Deploy backend

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          script: |
            set -e
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "=== GIT STATUS ==="
            git status
            echo "=== GIT LOG -5 ==="
            git log --oneline -5
            echo "=== GIT REFLOG -20 ==="
            git reflog -20 || true
            echo "=== ROUTE FILE LINE COUNTS ==="
            wc -l src/routes/*.ts
            echo "=== PM2 SHOW gogmi-api ==="
            pm2 show gogmi-api
            echo "=== DONE ==="
